<!DOCTYPE html>
<html lang='ko'>

<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <title>VAAX Quickshare List</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Pretendard:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css?v=12">

    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
        }

        .share-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            transition: color 0.2s;
            text-decoration: none;
            color: inherit;
            gap: 1rem;
        }

        .share-item:last-child {
            border-bottom: none;
        }

        .share-item:hover {
            background: transparent;
        }

        .item-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .share-item:hover .item-title {
            color: var(--primary-color);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .item-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            background: #f9fafb;
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        @media (max-width: 600px) {
            .share-item {
                padding: 0.75rem 1rem;
            }

            .item-title {
                font-size: 0.95rem;
            }

            .item-date {
                font-size: 0.75rem;
            }
        }
    </style>
    <style>
        /* Previous styles... */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9fafb;
        }

        h1 {
            color: #111827;
            text-align: center;
            margin-bottom: 2rem;
        }

        /* ... existing styles ... */
        .share-item {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: box-shadow 0.2s;
        }

        .share-item:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .item-title {
            font-weight: 600;
            color: #374151;
            font-size: 1rem;
            margin-right: 1rem;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .item-date {
            font-size: 0.8rem;
            color: #9ca3af;
            min-width: 80px;
            text-align: right;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-input {
            width: 100%;
            padding: 0.75rem;
            margin: 1rem 0;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .btn-cancel {
            padding: 0.5rem 1rem;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-confirm {
            padding: 0.5rem 1rem;
            border: none;
            background: #3b82f6;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Quickshare List</h1>
            <p>공유된 웹페이지 목록입니다.</p>
        </div>

        <div id="listContainer" class="share-list">
            <div class="empty-state">Loading...</div>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">🔐 보안 인증 Needed</h3>
            <p id="modalMessage">비밀번호를 입력하세요</p>
            <input type="password" id="modalInput" class="modal-input" placeholder="입력...">
            <div class="modal-actions">
                <button id="btnCancel" class="btn-cancel">취소</button>
                <button id="btnConfirm" class="btn-confirm">확인</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Use relative path for index.json assuming it's in the same directory
        const INDEX_URL = './data_x9k3.json';

        async function loadList() {
            const container = document.getElementById('listContainer');

            try {
                const response = await fetch(INDEX_URL);
                if (!response.ok) throw new Error('Failed to load index');

                // Force UTF-8 decoding to prevent Latin-1 interpretation
                const buffer = await response.arrayBuffer();
                const decoder = new TextDecoder('utf-8');
                const text = decoder.decode(buffer);
                const data = JSON.parse(text);

                const pages = data.pages || [];

                if (pages.length === 0) {
                    container.innerHTML = '<div class="empty-state">No shared pages yet.</div>';
                    return;
                }

                container.innerHTML = pages.map(page => {
                    // Date formatting (YYYY-MM-DD)
                    const dateObj = new Date(page.createdAt);
                    const date = dateObj.toLocaleDateString();
                    const filename = page.filename;
                    const title = page.title || "Untitled";

                    return `
                        <div class="share-item">
                            <a href="./${filename}" class="item-link" style="flex:1; display:flex; align-items:center; color:inherit; text-decoration:none; overflow:hidden;">
                                <span class="item-title">${title}</span>
                                <span class="item-date">${date}</span>
                            </a>
                            <button onclick="deletePage('${filename}', '${title.replace(/'/g, "\\'")}')" 
                                style="margin-left:10px; padding:4px 8px; font-size:0.75rem; background:#fee2e2; color:#991b1b; border:none; border-radius:4px; cursor:pointer;">
                                삭제
                            </button>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="empty-state">Failed to load list.</div>';
            }
        }

        loadList();

        // Firebase Setup for Auth Check
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANn76u2ZCJ5rq4IOpYaTzFy1JtKoPOM-c",
            authDomain: "vaax-board.firebaseapp.com",
            projectId: "vaax-board",
            storageBucket: "vaax-board.firebasestorage.app",
            messagingSenderId: "31682907508",
            appId: "1:31682907508:web:cd3ee4231ec8b3fb75b021",
            measurementId: "G-9YQY3DLR0P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Modal Variables
        const modal = document.getElementById('passwordModal');
        const modalInput = document.getElementById('modalInput');
        const modalMessage = document.getElementById('modalMessage');
        const btnCancel = document.getElementById('btnCancel');
        const btnConfirm = document.getElementById('btnConfirm');
        let resolveModal = null;

        // Promise-based Modal
        window.requestInput = function (message, isPassword = true) {
            return new Promise((resolve) => {
                modalMessage.innerText = message;
                modalInput.value = '';
                modalInput.type = isPassword ? 'password' : 'text';
                modal.style.display = 'flex';
                modalInput.focus();
                resolveModal = resolve;
            });
        }

        function closeModal(value) {
            modal.style.display = 'none';
            if (resolveModal) { resolveModal(value); resolveModal = null; }
        }

        btnCancel.onclick = () => closeModal(null);
        btnConfirm.onclick = () => closeModal(modalInput.value);
        modalInput.onkeydown = (e) => {
            if (e.key === 'Enter') closeModal(modalInput.value);
            if (e.key === 'Escape') closeModal(null);
        };

        window.deletePage = async function (filename, title) {
            if (!confirm(`정말 '${title}' 페이지를 삭제하시겠습니까?`)) return;

            const password = await requestInput("Admin Password:", true);
            if (!password) return;

            try {
                // 1. Verify Password
                const adminDoc = await getDoc(doc(db, "config", "admin"));
                if (!adminDoc.exists() || adminDoc.data().password !== password) {
                    alert("비밀번호가 올바르지 않습니다.");
                    return;
                }

                // 2. Get GitHub Token
                let token = localStorage.getItem('githubPat');
                if (!token) {
                    token = await requestInput("GitHub Personal Access Token (PAT):", true);
                    if (!token) {
                        alert('토큰이 없어 삭제할 수 없습니다.');
                        return;
                    }
                    if (confirm("이 토큰을 브라우저에 저장하시겠습니까?")) {
                        localStorage.setItem('githubPat', token);
                    }
                }

                // 3. Delete Logic (2 steps: Delete File, Update Index)
                const headers = {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                };

                // 3-1. Delete HTML File
                const fileResp = await fetch(`https://api.github.com/repos/vaax-maker/ai-news-daily/contents/docs/webshare/${filename}`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (fileResp.ok) {
                    const fileData = await fileResp.json();
                    await fetch(`https://api.github.com/repos/vaax-maker/ai-news-daily/contents/docs/webshare/${filename}`, {
                        method: 'DELETE',
                        headers: headers,
                        body: JSON.stringify({
                            message: `Delete webshare file: ${title}`,
                            sha: fileData.sha
                        })
                    });
                } else if (fileResp.status !== 404) {
                    throw new Error("HTML 파일 삭제 실패");
                }

                // 3-2. Update Index JSON
                const idxResp = await fetch(`https://api.github.com/repos/vaax-maker/ai-news-daily/contents/docs/webshare/data_x9k3.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (!idxResp.ok) throw new Error("Index 파일 로드 실패");

                const idxFile = await idxResp.json();
                const content = JSON.parse(atob(idxFile.content));

                // Filter out the deleted page
                content.pages = content.pages.filter(p => p.filename !== filename);

                // Update Index File
                const updateResp = await fetch(`https://api.github.com/repos/vaax-maker/ai-news-daily/contents/docs/webshare/data_x9k3.json`, {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify({
                        message: `Update index (remove ${title})`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                        sha: idxFile.sha
                    })
                });

                if (updateResp.ok) {
                    alert('✅ 삭제되었습니다! (반영까지 1-2분 소요될 수 있습니다)');
                    location.reload();
                } else {
                    throw new Error("Index 업데이트 실패");
                }

            } catch (e) {
                console.error(e);
                alert(`❌ 오류 발생: ${e.message}`);
            }
        }
    </script>
</body>

</html>
