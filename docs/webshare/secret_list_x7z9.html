<!DOCTYPE html>
<html lang='ko'>

<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <title>VAAX Quickshare List</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Pretendard:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css?v=12">

    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
        }

        .share-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            transition: color 0.2s;
            text-decoration: none;
            color: inherit;
            gap: 1rem;
        }

        .share-item:last-child {
            border-bottom: none;
        }

        .share-item:hover {
            background: transparent;
        }

        .item-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .share-item:hover .item-title {
            color: var(--primary-color);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .item-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            background: #f9fafb;
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        @media (max-width: 600px) {
            .share-item {
                padding: 0.75rem 1rem;
            }

            .item-title {
                font-size: 0.95rem;
            }

            .item-date {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Quickshare List</h1>
            <p>공유된 웹페이지 목록입니다.</p>
        </div>

        <div id="listContainer" class="share-list">
            <div class="empty-state">Loading...</div>
        </div>
    </div>

    <script>
        // Use relative path for index.json assuming it's in the same directory
        const INDEX_URL = './data_x9k3.json';

        async function loadList() {
            const container = document.getElementById('listContainer');

            try {
                const response = await fetch(INDEX_URL);
                if (!response.ok) throw new Error('Failed to load index');

                const data = await response.json();
                const pages = data.pages || [];

                if (pages.length === 0) {
                    container.innerHTML = '<div class="empty-state">No shared pages yet.</div>';
                    return;
                }

                container.innerHTML = pages.map(page => {
                    // Date formatting (YYYY-MM-DD)
                    const dateObj = new Date(page.createdAt);
                    const date = dateObj.toLocaleDateString();
                    const filename = page.filename;
                    const title = page.title || "Untitled";

                    return `
                        <a href="./${filename}" class="share-item">
                            <span class="item-title">${title}</span>
                            <span class="item-date">${date}</span>
                        </a>
                    `;
                }).join('');

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="empty-state">Failed to load list.</div>';
            }
        }

        loadList();
    </script>
</body>

</html>
