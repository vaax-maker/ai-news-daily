<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Webshare List</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            color: #111827;
            margin-bottom: 2rem;
        }

        .list-item {
            padding: 1rem 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .list-item a {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 0.25rem;
        }

        .list-item a:hover {
            text-decoration: underline;
        }

        .meta {
            font-size: 0.85rem;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <h1>📂 Secret Webshare List</h1>
    <div id="list">Loading...</div>

    <script>
        fetch('index.json')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('list');
                if (!data.pages || data.pages.length === 0) {
                    list.innerHTML = '<div style="color: #6b7280;">No pages found.</div>';
                    return;
                }

                list.innerHTML = data.pages.map(page => `
                    <div class="list-item">
                        <a href="${page.filename}" target="_blank">${page.title}</a>
                        <div class="meta">
                            ${new Date(page.createdAt).toLocaleDateString('ko-KR')} · 
                            <a href="${page.filename}" style="font-size: 0.85rem; color: #9ca3af; font-weight: normal;">Link</a>
                        </div>
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('list').innerHTML = `<div style="color: #ef4444;">Error loading list: ${err.message}</div>`;
            });
    </script>
</body>

</html>
