<!DOCTYPE html>
<html lang='ko'>

<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <title>VAAX Quickshare List</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Pretendard:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css?v=12">

    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
        }

        .share-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .share-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .share-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-color: var(--primary-color);
        }

        .item-info {
            flex: 1;
            min-width: 0;
            margin-right: 1rem;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .arrow-icon {
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .share-item:hover .arrow-icon {
            color: var(--primary-color);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            background: #f9fafb;
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        @media (max-width: 600px) {
            .share-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .arrow-icon {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Quickshare List</h1>
            <p>공유된 웹페이지 목록입니다.</p>
        </div>

        <div id="listContainer" class="share-list">
            <div class="empty-state">Loading...</div>
        </div>
    </div>

    <script>
        // Use relative path for index.json assuming it's in the same directory
        const INDEX_URL = './index.json';

        async function loadList() {
            const container = document.getElementById('listContainer');

            try {
                const response = await fetch(INDEX_URL);
                if (!response.ok) throw new Error('Failed to load index');

                const data = await response.json();
                const pages = data.pages || [];

                if (pages.length === 0) {
                    container.innerHTML = '<div class="empty-state">No shared pages yet.</div>';
                    return;
                }

                container.innerHTML = pages.map(page => {
                    const date = new Date(page.createdAt).toLocaleDateString();
                    const filename = page.filename;
                    const title = page.title || "Untitled";

                    return `
                        <a href="./${filename}" class="share-item">
                            <div class="item-info">
                                <div class="item-title">${title}</div>
                                <div class="item-meta">
                                    <span>${date}</span>
                                    <span>•</span>
                                    <span>${filename}</span>
                                </div>
                            </div>
                            <div class="arrow-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 12h14M12 5l7 7-7 7"/>
                                </svg>
                            </div>
                        </a>
                    `;
                }).join('');

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="empty-state">Failed to load list.</div>';
            }
        }

        loadList();
    </script>
</body>

</html>
