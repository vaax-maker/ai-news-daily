raw.forEach(s => { s.upside = s.t1 ? ((s.t1 - s.price) / s.price * 100) : 0; });

let currentFilter = 'all';
let sortKey = 'score';
let sortAsc = false;

const gradeOrder = {A:0,B:1,C:2,D:3};

function sortData(arr) {
  return [...arr].sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (sortKey === 'grade') { av = gradeOrder[a.grade]||9; bv = gradeOrder[b.grade]||9; }
    if (sortKey === 'opinion') { av = a.opinion==='매수검토'?0:1; bv = b.opinion==='매수검토'?0:1; }
    if (typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av - bv : bv - av;
  });
}

function dots(score) {
  let h = '';
  for (let i=1;i<=5;i++) h += `<div class="dot ${i<=score?'dot-on':'dot-off'}"></div>`;
  return `<div class="score-dots">${h}</div>`;
}

function perStr(per) {
  if (!per || per < -500 || per > 2000) return '<span class="muted">N/A</span>';
  const cls = per<0?'stat-neg':(per<30?'stat-pos':'num');
  return `<span class="${cls}">${per.toFixed(per>100?0:1)}</span>`;
}

function trendCls(t) {
  if (t.includes('상승')) return 'signal-up';
  if (t.includes('하락')) return 'signal-dn';
  return 'signal-neu';
}

function sectorCls(s) {
  return {robot:'s-robot',semi:'s-semi',defense:'s-defense',power:'s-power',battery:'s-battery'}[s]||'';
}

function renderTable() {
  const filtered = currentFilter==='all' ? raw : raw.filter(s=>s.sector===currentFilter);
  const sorted = sortData(filtered);
  let html = '';
  sorted.forEach(s => {
    const up = s.upside.toFixed(1);
    html += `<tr>
      <td><div class="name-main">${s.name}</div><div class="name-code">${s.code}</div></td>
      <td><span class="sector-tag ${sectorCls(s.sector)}">${s.sl}</span></td>
      <td class="num">${s.price.toLocaleString()}</td>
      <td class="muted">${(s.cap/10000).toFixed(s.cap>100000?1:2)}조</td>
      <td>${perStr(s.per)}</td>
      <td class="num">${s.pbr.toFixed(2)}</td>
      <td class="${s.roe>20?'stat-pos':s.roe<0?'stat-neg':'num'}">${s.roe.toFixed(1)}</td>
      <td class="${s.rsi>60?'stat-pos':s.rsi<40?'stat-neg':'num'}">${s.rsi.toFixed(1)}</td>
      <td><div class="score-bar">${dots(s.score)}<span style="font-size:10px;color:var(--color-text-secondary);margin-left:2px">${s.score}/5</span></div></td>
      <td><span class="grade-${s.grade}">${s.grade}</span></td>
      <td><span class="${trendCls(s.trend)}">${s.trend}</span></td>
      <td class="${s.fgn>0?'stat-pos':'stat-neg'}">${s.fgn>0?'+':''}${s.fgn.toFixed(1)}%</td>
      <td class="${s.inst>0?'stat-pos':'stat-neg'}">${s.inst>0?'+':''}${s.inst.toFixed(1)}%</td>
      <td><span class="stat-pos">${s.t1.toLocaleString()}</span> <span class="muted">(+${up}%)</span></td>
      <td class="stat-neg" style="font-size:11px">${s.stop.toLocaleString()}</td>
      <td><span class="${s.opinion==='매수검토'?'tag-buy':'tag-hold'}">${s.opinion}</span></td>
    </tr>`;
  });
  document.getElementById('tbody').innerHTML = html;
  document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
}

function filterSector(sector, btn) {
  currentFilter = sector;
