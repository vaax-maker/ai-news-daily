    <div class="container">
        
<div class="page-header">
    <div class="header-titles">
        <p class="eyebrow">Community</p>
        <h1>자유 게시판</h1>
        <p class="subtitle">누구나 자유롭게 의견을 나누고 자료를 공유하는 공간입니다.</p>

<section class="board-card">
    <div class="board-container">
        <!-- 게시판 컨트롤 (글쓰기 버튼 등) -->
        <div class="board-controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="검색어를 입력하세요">
            </div>
            <button id="btnWrite" class="primary-btn">글쓰기</button>
        </div>

        <!-- 게시글 목록 -->
        <div class="board-list-section">
            <table class="styled-table board-table">
                <thead>
                    <tr>
                        <th class="col-num">번호</th>
                        <th class="col-subject">제목</th>
                        <th class="col-writer">작성자</th>
                        <th class="col-date">작성일</th>
                        <th class="col-views">조회</th>
                    </tr>
                </thead>
                <tbody id="boardBody">
                    <!-- 자바스크립트로 데이터가 로드됩니다 -->
                    <tr>
                        <td colspan="5" class="loading-cell">게시글을 불러오는 중...</td>
                    </tr>
                </tbody>
            </table>
            <!-- 페이지네이션 (추후 구현 가능, 현재는 더보기 방식 또는 전체 로드) -->
            <div id="loadingIndicator" class="loading-indicator hidden">Loading...</div>
        </div>

        <!-- 글쓰기/수정 폼 (기본 숨김) -->
        <div id="writeForm" class="board-form hidden">
            <h3 id="formTitle">새 게시글 작성</h3>
            <div class="form-group">
                <label>작성자</label>
                <input type="text" id="inputWriter" placeholder="이름/닉네임" maxlength="20">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="inputPassword" placeholder="수정/삭제용 비밀번호 (4자리 이상)">
            </div>
            <div class="form-group">
                <label>제목</label>
                <input type="text" id="inputTitle" placeholder="제목을 입력하세요" maxlength="100">
            </div>

            <!-- 첨부파일 (URL 입력 방식) -->
            <!-- Quill Editor -->
            <div class="form-group">
                <label>내용 (이미지나 공유할 파일 링크를 본문에 직접 입력하세요)</label>
                <div id="editor-container" style="height: 300px;"></div>
            </div>

            <div class="form-actions">
                <button id="btnCancel" class="secondary-btn">취소</button>
                <button id="btnSave" class="primary-btn">등록</button>
            </div>
        </div>

        <!-- 게시글 상세 보기 (기본 숨김) -->
        <div id="viewSection" class="board-view hidden">
            <div class="view-header">
                <h2 id="viewTitle">제목</h2>
                <div class="view-meta">
                    <span id="viewWriter">작성자</span>
                    <span class="divider">|</span>
                    <span id="viewDate">날짜</span>
                </div>
            </div>

            <div class="view-content ql-editor" id="viewContent">
                내용
            </div>
            <div class="view-actions">
                <button id="btnList" class="secondary-btn">목록</button>
                <div class="right-actions">
                    <button id="btnEdit" class="secondary-btn">수정</button>
                    <button id="btnDelete" class="danger-btn">삭제</button>
                </div>
            </div>

            <!-- 댓글 섹션 -->
            <div class="comment-section">
                <h3 class="comment-title">댓글</h3>
                <div id="commentList" class="comment-list">
                    <!-- 댓글 아이템이 여기에 추가됨 -->
                    <div class="loading-msg">댓글을 불러오는 중...</div>
                </div>

                <div class="comment-form-box">
                    <div class="comment-inputs">
                        <input type="text" id="cmtWriter" placeholder="닉네임" maxlength="10">
                        <input type="password" id="cmtPassword" placeholder="비밀번호 (삭제용)" maxlength="20">
                    </div>
                    <div class="comment-textarea-wrapper">
                        <textarea id="cmtContent" placeholder="댓글을 남겨보세요" rows="2"></textarea>
                        <button id="btnSaveCmt" class="primary-btn sm-btn">등록</button>
                    </div>
                </div>
            </div>
</section>

<!-- Quill CSS -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<!-- Quill JS -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, getDoc, doc, query, orderBy, limit, serverTimestamp, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 사용자 설정
    const firebaseConfig = {
        apiKey: "AIzaSyANn76u2ZCJ5rq4IOpYaTzFy1JtKoPOM-c",
        authDomain: "vaax-board.firebaseapp.com",
        projectId: "vaax-board",
        storageBucket: "vaax-board.firebasestorage.app",
        messagingSenderId: "31682907508",
        appId: "1:31682907508:web:cd3ee4231ec8b3fb75b021",
        measurementId: "G-XF41VB6W7V"
    };

    // Initialize Firebase
    let db;
    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        console.log("Firebase initialized");
    } catch (e) {
        console.error("Firebase init error. Check config.", e);
        document.querySelector('.loading-cell').textContent = "Firebase 설정이 필요합니다. 코드를 확인해주세요.";
    }

    // Quill Setup
    var quill = new Quill('#editor-container', {
        theme: 'snow',
        placeholder: '내용을 입력하세요. 상단 툴바를 이용해 이미지 URL을 삽입할 수 있습니다.',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline', 'strike'],
                ['blockquote', 'code-block'],
                [{ 'header': 1 }, { 'header': 2 }],
                [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                [{ 'color': [] }, { 'background': [] }],
                ['link', 'image'],
                ['clean']
            ]
        }
    });

    const boardBody = document.getElementById('boardBody');
    const writeForm = document.getElementById('writeForm');
    const viewSection = document.getElementById('viewSection');
    const boardListSection = document.querySelector('.board-list-section');

    // Board Elements
    const inputWriter = document.getElementById('inputWriter');
    const inputPassword = document.getElementById('inputPassword');
    const inputTitle = document.getElementById('inputTitle');

    // Comment Elements
    const commentList = document.getElementById('commentList');
    const cmtWriter = document.getElementById('cmtWriter');
    const cmtPassword = document.getElementById('cmtPassword');
    const cmtContent = document.getElementById('cmtContent');
    const btnSaveCmt = document.getElementById('btnSaveCmt');

    let currentMode = 'list';
    let currentDocId = null;
    let unsubscribeComments = null; // 댓글 리스너 해제용

    // --- Functions ---

    // 목록 불러오기
    async function loadPosts() {
        if (!db) return;
        boardBody.innerHTML = '<tr><td colspan="5" class="loading-cell">로딩중...</td></tr>';

        try {
            // 날짜 내림차순 정렬
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(50));
            const querySnapshot = await getDocs(q);

            boardBody.innerHTML = '';

            if (querySnapshot.empty) {
                boardBody.innerHTML = '<tr><td colspan="5" class="loading-cell">등록된 게시글이 없습니다.</td></tr>';
                return;
            }

            let index = 1;

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const row = document.createElement('tr');
                const dateObj = data.createdAt ? data.createdAt.toDate() : new Date();
                const dateStr = dateObj.toISOString().split('T')[0];

                // 제목에 첨부파일 아이콘 (Quill 이미지 존재 여부 등 체크 가능하나 생략)
                row.innerHTML = `
                    <td class="col-num">${index++}</td>
                    <td class="col-subject">
                        <a href="#" data-id="${doc.id}">${escapeHtml(data.title)}</a>
                    </td>
                    <td class="col-writer">${escapeHtml(data.writer)}</td>
                    <td class="col-date">${dateStr}</td>
                    <td class="col-views">${data.views || 0}</td>
                `;
                boardBody.appendChild(row);
            });

            // 클릭 이벤트 연결
            document.querySelectorAll('.col-subject a').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = e.target.closest('a');
                    if (target) viewPost(target.dataset.id);
                });
            });

        } catch (error) {
            console.error("Error loading posts:", error);
            boardBody.innerHTML = `<tr><td colspan="5" class="loading-cell">에러 발생: ${error.message}<br>API 키 설정을 확인해주세요.</td></tr>`;
        }
    }

    // 게시글 상세 보기
    async function viewPost(id) {
        if (!db) return;
        currentDocId = id;
        showSection('view');

        const viewTitle = document.getElementById('viewTitle');
        const viewWriter = document.getElementById('viewWriter');
        const viewDate = document.getElementById('viewDate');
        const viewContent = document.getElementById('viewContent');

        viewContent.innerHTML = '로딩중...';
        commentList.innerHTML = '<div class="loading-msg">댓글을 불러오는 중...</div>';

        try {
            const docRef = doc(db, "posts", id);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                viewTitle.textContent = data.title;
                viewWriter.textContent = data.writer;
                const dateObj = data.createdAt ? data.createdAt.toDate() : new Date();
                viewDate.textContent = dateObj.toLocaleString();

                // Quill Content (HTML)
                viewContent.innerHTML = data.content;

                // 텍스트로 된 URL을 자동으로 링크로 변환
                linkifyElement(viewContent);

                // 댓글 로드 시작
                loadComments(id);

                // 조회수 증가 (Optional)
                // updateDoc(docRef, { views: (data.views || 0) + 1 });
            } else {
                alert("삭제되거나 없는 게시글입니다.");
                showSection('list');
            }
        } catch (e) {
            console.error("Error fetching doc:", e);
            alert("불러오기 실패");
        }
    }

    // 댓글 실시간 로드
    function loadComments(postId) {
        if (unsubscribeComments) unsubscribeComments(); // 이전 리스너 해제

        const commentsRef = collection(db, "posts", postId, "comments");
        const q = query(commentsRef, orderBy("createdAt", "asc"));

        unsubscribeComments = onSnapshot(q, (snapshot) => {
            commentList.innerHTML = '';
            if (snapshot.empty) {
                commentList.innerHTML = '<div class="empty-msg-sm">첫 번째 댓글을 남겨보세요!</div>';
                return;
            }

            snapshot.forEach((doc) => {
                const cmt = doc.data();
                const cmtDate = cmt.createdAt ? cmt.createdAt.toDate().toLocaleString() : '';

                const div = document.createElement('div');
                div.className = 'comment-item';
                div.innerHTML = `
                    <div class="comment-head">
                        <span class="cmt-writer">${escapeHtml(cmt.writer)}</span>
                        <span class="cmt-date">${cmtDate}</span>
                        <button class="btn-del-cmt" data-id="${doc.id}">x</button>
                    </div>
                    <div class="comment-body">${escapeHtml(cmt.content).replace(/\n/g, '<br>')}</div>
                `;
                // 댓글 내용 링크 변환
                linkifyElement(div.querySelector('.comment-body'));
                commentList.appendChild(div);
            });

            // 댓글 삭제 버튼 핸들러
            document.querySelectorAll('.btn-del-cmt').forEach(btn => {
                btn.addEventListener('click', () => deleteComment(postId, btn.dataset.id));
            });
        });
    }

    // 댓글 저장
    async function saveComment() {
        if (!currentDocId) return;
        const writer = cmtWriter.value.trim();
        const password = cmtPassword.value.trim();
        const content = cmtContent.value.trim();

        if (!writer || !password || !content) {
            alert("닉네임, 비밀번호, 내용을 모두 입력해주세요.");
            return;
        }

        try {
            await addDoc(collection(db, "posts", currentDocId, "comments"), {
                writer,
                password,
                content,
                createdAt: serverTimestamp()
            });
            cmtContent.value = ''; // 내용만 초기화
        } catch (e) {
            console.error("Comment save error:", e);
            alert("댓글 등록 실패");
        }
    }

    // 댓글 삭제
    async function deleteComment(postId, commentId) {
        const inputPw = prompt("댓글 비밀번호를 입력하세요");
        if (!inputPw) return;

        try {
            const cmtRef = doc(db, "posts", postId, "comments", commentId);
            const cmtSnap = await getDoc(cmtRef);

            if (cmtSnap.exists() && cmtSnap.data().password === inputPw) {
                await deleteDoc(cmtRef);
                alert("댓글이 삭제되었습니다.");
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        } catch (e) {
            console.error("Comment delete error:", e);
            alert("삭제 중 오류 발생");
        }
    }

    // 글 저장
    async function savePost() {
        if (!db) {
            alert("Firebase 설정 오류");
            return;
        }

        const writer = inputWriter.value.trim();
        const password = inputPassword.value.trim();
        const title = inputTitle.value.trim();
        const content = quill.root.innerHTML;

        // Quill 에디터가 비었는지 확인 (기본적으로 <p><br></p>가 있음)
        const textContent = quill.getText().trim();
        const hasImage = content.includes('<img');

        if (!writer || !password || !title || (!textContent && !hasImage)) {
            alert("내용을 입력해주세요. (내용 포함)");
            return;
        }

        try {
            const docData = {
                writer,
                title,
                content,
                updatedAt: serverTimestamp()
            };

            if (currentDocId) {
                // 수정
                await updateDoc(doc(db, "posts", currentDocId), docData);
                alert("수정되었습니다.");
            } else {
                // 신규
                docData.password = password;
                docData.views = 0;
                docData.createdAt = serverTimestamp();
                await addDoc(collection(db, "posts"), docData);
                alert("등록되었습니다.");
            }
            showSection('list');
            loadPosts();
        } catch (e) {
            console.error("Error saving:", e);
            alert("저장 중 오류가 발생했습니다: " + e.message);
        }
    }

    // 글 삭제
    async function deletePost() {
        if (!confirm("정말 삭제하시겠습니까? (댓글도 함께 삭제되지 않을 수 있습니다)")) return;

        const inputPw = prompt("비밀번호를 입력하세요");
        if (!inputPw) return;

        try {
            const docRef = doc(db, "posts", currentDocId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists() && docSnap.data().password === inputPw) {
                await deleteDoc(docRef);
                alert("삭제되었습니다.");
                showSection('list');
                loadPosts();
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        } catch (e) {
            console.error("Delete error:", e);
            alert("삭제 실패");
        }
    }

    // UI 제어
    function showSection(mode) {
        currentMode = mode;
        if (mode === 'list') {
            boardListSection.classList.remove('hidden');
            writeForm.classList.add('hidden');
            viewSection.classList.add('hidden');
            document.getElementById('btnWrite').classList.remove('hidden');
            document.querySelector('.board-controls').classList.remove('hidden');
            if (unsubscribeComments) unsubscribeComments(); // 리스트로 갈 때 끄기
        } else if (mode === 'write') {
            boardListSection.classList.add('hidden');
            writeForm.classList.remove('hidden');
            viewSection.classList.add('hidden');
            document.querySelector('.board-controls').classList.add('hidden');
        } else if (mode === 'view') {
            boardListSection.classList.add('hidden');
            writeForm.classList.add('hidden');
            viewSection.classList.remove('hidden');
            document.querySelector('.board-controls').classList.add('hidden');
        }
    }

    function escapeHtml(text) {
        if (!text) return "";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function linkifyElement(element) {
        const urlRegex = /(https?:\/\/[^\s<]+)/g;
        const treeWalker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
        const nodes = [];
        while (treeWalker.nextNode()) nodes.push(treeWalker.currentNode);

        nodes.forEach(node => {
            // 이미 링크나 스크립트 안에 있는 텍스트는 건너뜀
            if (node.parentNode.tagName === 'A' || node.parentNode.tagName === 'SCRIPT' || node.parentNode.tagName === 'STYLE') return;

            const text = node.nodeValue;
            if (urlRegex.test(text)) {
                const fragment = document.createDocumentFragment();
                let lastIdx = 0;
                text.replace(urlRegex, (match, url, idx) => {
                    // 이전 텍스트 추가
                    fragment.appendChild(document.createTextNode(text.slice(lastIdx, idx)));

                    // 링크 생성
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.textContent = url;
                    a.className = "autolink"; // 스타일 적용을 위해 클래스 추가
                    fragment.appendChild(a);

                    lastIdx = idx + match.length;
                });
                // 남은 텍스트 추가
                fragment.appendChild(document.createTextNode(text.slice(lastIdx)));
                node.parentNode.replaceChild(fragment, node);
            }
        });
    }

    // --- Event Listeners ---
    document.getElementById('btnWrite').addEventListener('click', () => {
        currentDocId = null;
        document.getElementById('formTitle').textContent = "새 게시글 작성";
        inputWriter.value = "";
        inputPassword.disabled = false;
        inputPassword.value = "";
        inputTitle.value = "";
        quill.setContents([]);
        showSection('write');
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
        showSection('list');
    });

    document.getElementById('btnList').addEventListener('click', () => {
        showSection('list');
    });

    document.getElementById('btnSave').addEventListener('click', savePost);
    btnSaveCmt.addEventListener('click', saveComment); // 댓글 등록

    // 수정 버튼
    document.getElementById('btnEdit').addEventListener('click', async () => {
        const inputPw = prompt("비밀번호를 입력하세요");
        if (!inputPw) return;

        const docRef = doc(db, "posts", currentDocId);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists() && docSnap.data().password === inputPw) {
            document.getElementById('formTitle').textContent = "게시글 수정";
            inputWriter.value = docSnap.data().writer;
            inputPassword.value = "****";
            inputPassword.disabled = true;
            inputTitle.value = docSnap.data().title;

            quill.clipboard.dangerouslyPasteHTML(docSnap.data().content);

            showSection('write');
        } else {
            alert("비밀번호가 일치하지 않습니다.");
        }
    });

    document.getElementById('btnDelete').addEventListener('click', deletePost);

    // Initial Load
    loadPosts();
