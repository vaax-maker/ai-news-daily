<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<title>통합 검색 · 오늘의 AI 소식</title>
<style>
:root{
  --paper:#FAFAF8; --card:#FFFFFF;
  --ink:#15171C; --ink-dim:#565C68; --muted:#9298A3;
  --line:rgba(21,23,28,.10); --line-2:rgba(21,23,28,.05);
  --accent:#0E9E7E; --accent-ink:#0A7A62; --accent-tint:rgba(14,158,126,.09);
  --kr:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  /* 발행물별 고유색 — 상호 구분 + 대비 확보(배경 #FAFAF8 위 명도대비 4.5:1 이상, WCAG AA) */
  --c-news:#0E9E7E; --c-voice:#C1590A; --c-brief:#2E5FE0; --c-econ:#96650A; --c-report:#9B4FD1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#EEEFEF;color:var(--ink);font-family:var(--kr);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.shell{max-width:680px;margin:0 auto;min-height:100vh;position:relative;background:var(--paper);
  box-shadow:0 0 0 1px var(--line-2)}
a{color:inherit;text-decoration:none}

/* masthead — 절제된 라인형, 그라디언트/블러 없이 */
.mast{display:flex;align-items:baseline;justify-content:space-between;
  padding:22px 28px 18px;border-bottom:1px solid var(--ink)}
.brand{font-size:13px;font-weight:800;letter-spacing:.02em}
.brand em{font-style:normal;color:var(--accent)}
.mast .back{font-size:11.5px;color:var(--muted);letter-spacing:.01em;padding-bottom:1px;
  border-bottom:1px solid transparent}
.mast .back:hover{color:var(--ink);border-color:var(--line)}

/* intro — 에디토리얼 헤드라인, 장식 최소화 */
.intro{padding:34px 28px 22px;border-bottom:1px solid var(--line)}
.intro .num{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px}
.intro h1{font-size:clamp(26px,5.6vw,34px);line-height:1.22;font-weight:800;letter-spacing:-.025em}
.intro h1 .accent-dot{color:var(--accent)}

/* search — 밑줄형 인풋, 박스 없이 절제 */
.searchwrap{padding:22px 28px 0}
.searchbox{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--ink);
  padding:6px 2px 12px}
.searchbox svg{flex:0 0 auto;opacity:.4}
.searchbox input{flex:1;border:0;outline:0;background:transparent;font-family:var(--kr);
  font-size:18px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.searchbox input::placeholder{color:var(--muted);font-weight:400}
.searchbox .clear{display:none;font-size:11.5px;color:var(--muted);cursor:pointer;
  padding:5px 9px;border-radius:7px;border:1px solid var(--line);white-space:nowrap}
.searchbox .clear:hover{color:var(--ink);border-color:var(--ink)}
.searchbox .clear.show{display:block}

/* filter chips — 언더라인 탭 스타일(둥근 필 대신) */
.chips{display:flex;gap:2px;padding:14px 24px 0;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  padding:9px 12px;border-radius:8px;color:var(--muted);cursor:pointer;user-select:none;
  transition:background .12s ease, color .12s ease}
.chip:hover{background:var(--line-2);color:var(--ink-dim)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.chip[data-pub="뉴스"]{color:var(--c-news)}
.chip[data-pub="보이스"]{color:var(--c-voice)}
.chip[data-pub="브리프"]{color:var(--c-brief)}
.chip[data-pub="시황"]{color:var(--c-econ)}
.chip[data-pub="개별리포트"]{color:var(--c-report)}
.chip[data-cat="tech"]{color:var(--c-brief)}
.chip[data-cat="econ"]{color:var(--c-econ)}
.datefilter{cursor:pointer;font-weight:700;color:var(--c-brief);text-decoration:underline;text-underline-offset:2px}
.chip.active{background:var(--ink);color:#fff !important}
.chip.active .dot{background:#fff;opacity:1}
.chip .cnt{color:var(--muted);font-weight:500;font-size:11.5px}
.chip.active .cnt{color:rgba(255,255,255,.65)}

/* result count */
.rescount{padding:16px 28px 8px;font-size:11.5px;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;letter-spacing:.01em}
.rescount b{color:var(--ink);font-weight:700}

/* list — 카드 대신 구분선형 로우, 더 담백하게 */
.list{padding:2px 28px 70px}
.item{display:block;padding:18px 0;border-bottom:1px solid var(--line);transition:opacity .12s ease}
.item:hover .t{color:var(--accent-ink)}
.item:hover{opacity:.94}
.item .top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.pubtag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.pubtag.뉴스{color:var(--c-news)}
.pubtag.보이스{color:var(--c-voice)}
.pubtag.브리프{color:var(--c-brief)}
.pubtag.시황{color:var(--c-econ)}
.pubtag.개별리포트{color:var(--c-report)}
.item .date{font-size:11px;color:var(--muted);font-weight:600}
.item .channel{font-size:11px;color:var(--muted)}
.item .channel::before{content:"·";margin-right:9px;color:var(--line)}
.item .t{font-size:16px;font-weight:700;letter-spacing:-.012em;line-height:1.44;
  color:var(--ink);transition:color .12s ease}
.item .s{margin-top:5px;font-size:13px;color:var(--ink-dim);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:none;color:var(--accent-ink);font-weight:700;border-bottom:1.5px solid var(--accent);
  padding:0}

.empty{text-align:center;color:var(--muted);padding:70px 20px;font-size:13.5px}
.empty .big{font-size:26px;margin-bottom:12px;opacity:.5}

footer{padding:26px 28px;text-align:center;font-size:10.5px;color:var(--muted);
  border-top:1px solid var(--line);letter-spacing:.02em}
</style>
</head>
<body>
<div class="shell">
  <header class="mast">
    <div class="brand">오늘의 <em>AI 소식</em></div>
    <a class="back" href="index.html">← 오늘의 뉴스</a>
  </header>

  <div class="intro">
    <div class="num">Unified Search</div>
    <h1>다섯 갈래 발행물을<br>한 자리에서<span class="accent-dot">.</span></h1>
  </div>

  <div class="searchwrap">
    <div class="searchbox">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="q" type="search" placeholder="키워드로 검색 — 오픈AI, 에이전트, 반도체…" autocomplete="off">
      <span class="clear" id="clear">지우기</span>
    </div>
  </div>

  <div class="chips" id="chips">
    <div class="chip active" data-pub="all"><span>전체</span><span class="cnt" id="cnt-all"></span></div>
    <div class="chip" data-pub="뉴스"><span class="dot"></span><span>뉴스</span><span class="cnt" id="cnt-뉴스"></span></div>
    <div class="chip" data-pub="보이스"><span class="dot"></span><span>보이스</span><span class="cnt" id="cnt-보이스"></span></div>
    <div class="chip" data-cat="tech"><span class="dot"></span><span>기술</span><span class="cnt" id="cnt-기술"></span></div>
    <div class="chip" data-cat="econ"><span class="dot"></span><span>경제</span><span class="cnt" id="cnt-경제"></span></div>
  </div>

  <div class="rescount" id="rescount"></div>

  <div class="list" id="list"></div>

  <footer>오늘의 AI 소식 — 뉴스 · 보이스 · 브리프 · 시황 · 개별리포트 통합 검색</footer>
</div>

<script>
(function(){
  var CHIP_KEYS = ['뉴스','보이스','기술','경제'];   // 칩 카운트 대상(뉴스·보이스=pub, 기술·경제=cat)
  var DATA = [];
  var activePub = 'all';
  var activeCat = null;   // '기술'=tech / '경제'=econ 카테고리 필터(브리프·시황·개별리포트 대상)
  var dateFilter = null;  // 브리프/시황 드릴다운: 그 날짜만(URL ?date=)
  var listEl = document.getElementById('list');
  var qEl = document.getElementById('q');
  var clearEl = document.getElementById('clear');
  var rescountEl = document.getElementById('rescount');
  var chipsEl = document.getElementById('chips');

  function esc(s){
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 부분매치 하이라이트(대소문자 무시). 정규식 특수문자는 이스케이프한다.
  function hl(text, q){
    var t = esc(text || '');
    if(!q) return t;
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return t.replace(re, '<mark>$1</mark>');
  }

  function fmtDate(d){
    if(!d) return '';
    return d.replace(/-/g,'.');
  }

  function matches(r, ql){
    if(!ql) return true;
    var hay = ((r.title||'') + ' ' + (r.summary||'') + ' ' + (r.channel||'')).toLowerCase();
    return hay.indexOf(ql) !== -1;
  }

  function counts(rows){
    var c = {'뉴스':0,'보이스':0,'기술':0,'경제':0};
    rows.forEach(function(r){
      if(r.pub === '뉴스') c['뉴스']++;
      else if(r.pub === '보이스') c['보이스']++;
      if(r.cat === 'tech') c['기술']++;
      else if(r.cat === 'econ') c['경제']++;
    });
    return c;
  }

  function render(){
    var q = (qEl.value || '').trim();
    var ql = q.toLowerCase();
    clearEl.classList.toggle('show', !!q);

    // 칩 카운트는 pub 필터와 무관하게 검색어 기준 전체에서 집계한다.
    var searchScoped = DATA.filter(function(r){ return matches(r, ql); });
    var rows = searchScoped.filter(function(r){
      if(dateFilter && String(r.date) !== dateFilter) return false;  // 브리프 드릴다운(그 날짜만)
      if(activeCat) return r.cat === activeCat;            // 기술/경제 = 카테고리 필터
      if(activePub !== 'all') return r.pub === activePub;  // 뉴스/보이스 = pub 필터
      return true;
    });

    var c = counts(searchScoped);
    document.getElementById('cnt-all').textContent = searchScoped.length;
    CHIP_KEYS.forEach(function(p){ document.getElementById('cnt-' + p).textContent = c[p]; });

    rescountEl.innerHTML = '<span><b>' + rows.length + '</b>건 결과</span>' +
      (dateFilter ? '<span class="datefilter" id="datefilter">' + fmtDate(dateFilter) + ' 브리프 ✕</span>' : '') +
      (q ? '<span>"' + esc(q) + '"</span>' : '');

    if(!rows.length){
      listEl.innerHTML = '<div class="empty"><div class="big">＋</div>검색 결과가 없습니다.</div>';
      return;
    }

    listEl.innerHTML = rows.map(function(r){
      var channel = r.channel ? '<span class="channel">' + esc(r.channel) + '</span>' : '';
      return '<a class="item" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
        '<div class="top">' +
          '<span class="pubtag ' + r.pub + '">' + r.pub + '</span>' +
          '<span class="date">' + fmtDate(r.date) + '</span>' +
          channel +
        '</div>' +
        '<div class="t">' + hl(r.title, q) + '</div>' +
        (r.summary ? '<div class="s">' + hl(r.summary, q) + '</div>' : '') +
      '</a>';
    }).join('');
  }

  chipsEl.addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if(!chip) return;
    Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function(c){ c.classList.remove('active'); });
    chip.classList.add('active');
    if(chip.hasAttribute('data-cat')){ activeCat = chip.getAttribute('data-cat'); activePub = 'all'; }
    else { activePub = chip.getAttribute('data-pub') || 'all'; activeCat = null; }
    dateFilter = null;   // 칩 클릭 시 브리프 드릴다운 해제
    render();
  });

  // 브리프 드릴다운 날짜 필터 해제(✕)
  rescountEl.addEventListener('click', function(e){
    if(e.target.id === 'datefilter'){ dateFilter = null; render(); }
  });

  qEl.addEventListener('input', render);
  clearEl.addEventListener('click', function(){
    qEl.value = '';
    qEl.focus();
    render();
  });

  // URL 파라미터(?date=&cat=&q=) — 브리프/시황 항목의 드릴다운 진입점.
  function applyUrlParams(){
    var p = new URLSearchParams(location.search);
    var pd = p.get('date'), pc = p.get('cat'), pq = p.get('q');
    if(pq){ qEl.value = pq; }
    if(pc){
      activeCat = pc; activePub = 'all';
      var tc = chipsEl.querySelector('.chip[data-cat="' + pc + '"]');
      if(tc){
        Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function(c){ c.classList.remove('active'); });
        tc.classList.add('active');
      }
    }
    if(pd){ dateFilter = pd; }
  }

  fetch('search-index.json')
    .then(function(res){ return res.json(); })
    .then(function(data){
      DATA = data || [];
      applyUrlParams();
      render();
    })
    .catch(function(){
      listEl.innerHTML = '<div class="empty"><div class="big">！</div>검색 인덱스를 불러오지 못했습니다.</div>';
    });
})();
</script>
</body>
</html>
