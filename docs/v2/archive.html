<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘, 세상이 · 아카이브 · VAAX</title>
<style>
/* ===== 오늘, 세상이 — v3 (다크 경종 헤드 + 라이트 뉴스룸 본문 · 톤다운) ===== */
  .wake *{box-sizing:border-box}
  .wake{
    --paper:#F7F6F3;        /* warm off-white body */
    --paper-2:#FFFFFF;      /* card */
    --ink:#1A1B1E;          /* near-black text */
    --muted:#6E7178;        /* warm grey */
    --line:#E5E3DC;         /* hairline (light) */
    --hero:#121417;         /* dark hero */
    --hero-2:#1B1E22;
    --hero-ink:#F1EFEA;
    --hero-muted:#9BA0A8;
    --hero-line:#2A2E34;
    --signal:#D8452F;       /* editorial vermilion (toned) */
    --signal-soft:#F2E3DE;  /* soft tint for light bg */
    --font-display:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
    --font-body:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
    --font-mono:"SF Mono","JetBrains Mono",ui-monospace,"D2Coding",Menlo,monospace;
    background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.6;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(18px,5vw,52px)}

  /* masthead */
  .mast{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 18px}
  .mast__brand{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
  .mast__brand .sub{font-family:var(--font-mono);font-weight:400;font-size:11px;letter-spacing:.14em;color:var(--muted);margin-left:10px;text-transform:uppercase}
  .mast__meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-align:right}
  .mast__cad{color:var(--signal)}

  /* ---------- HERO (dark) : 대표 경종 + 라이브 리스트 ---------- */
  .hero{background:var(--hero);color:var(--hero-ink);border-radius:10px;overflow:hidden;
    display:grid;grid-template-columns:1.5fr 1fr}
  .lead{padding:clamp(28px,4vw,46px);border-right:1px solid var(--hero-line);min-width:0;
    display:flex;flex-direction:column;justify-content:center}
  .lead__eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:11.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--signal);margin-bottom:20px}
  .lead__eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--signal)}
  .lead__msg{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4.2vw,42px);
    line-height:1.14;letter-spacing:-.02em;text-wrap:balance;margin:0}
  .lead__msg .hl{color:var(--signal)}
  .lead__fact{display:flex;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--hero-line)}
  .lead__fact .k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;color:var(--hero-muted);text-transform:uppercase;padding-top:3px;white-space:nowrap}
  .lead__fact .v{font-size:15px;color:var(--hero-ink)}
  .lead__interp{color:var(--hero-muted);font-size:14px;line-height:1.7;margin:14px 0 0}
  .lead__interp b{color:var(--hero-ink);font-weight:600}

  /* live list */
  .live{padding:clamp(24px,3vw,34px) clamp(22px,2.6vw,30px);background:var(--hero-2);display:flex;flex-direction:column}
  .live__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .live__head h2{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-muted);margin:0;font-weight:600}
  .live__badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--signal);display:inline-flex;align-items:center;gap:6px}
  .live__badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--signal);animation:blink 2.6s ease-in-out infinite}
  .live__item{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--hero-line);align-items:baseline}
  .live__item:first-of-type{border-top:0}
  .live__date{font-family:var(--font-mono);font-size:11px;color:var(--hero-muted);font-variant-numeric:tabular-nums}
  .live__t{font-size:14px;line-height:1.45;color:var(--hero-ink)}
  .live__item.is-today .live__date{color:var(--signal)}
  .live__item.is-today .live__t{font-weight:700}
  .live__all{margin-top:auto;padding-top:16px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--hero-muted)}

  /* ---------- BODY (light) : 카드뉴스 ---------- */
  .sec{padding:clamp(34px,5vw,56px) 0 0}
  .sec__head{display:flex;align-items:baseline;gap:12px;margin-bottom:22px}
  .sec__eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--signal)}
  .sec__head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(20px,3vw,27px);letter-spacing:-.02em;margin:0}
  .sec__head .more{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);letter-spacing:.05em}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;
    display:flex;flex-direction:column;transition:box-shadow .25s ease,transform .25s ease}
  .card:hover{box-shadow:0 10px 30px -12px rgba(0,0,0,.18);transform:translateY(-2px)}
  /* 카드뉴스 썸네일 zone */
  .thumb{position:relative;height:60px;background:linear-gradient(135deg,var(--hero),var(--hero-2));
    display:flex;align-items:center;padding:0 16px;overflow:hidden}
  .thumb__ghost{position:absolute;top:50%;right:8px;transform:translateY(-50%);font-family:var(--font-display);font-weight:800;
    font-size:42px;line-height:1;color:rgba(255,255,255,.07);letter-spacing:-.04em}
  .thumb__kw{position:relative;font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--hero-ink);line-height:1.2;text-wrap:balance}
  .thumb__kw .hl{color:var(--signal)}
  .card__body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:11px;flex:1}
  .card__tags{display:flex;gap:7px;flex-wrap:wrap}
  .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:3px 8px}
  .tag.ai{color:var(--ink);border-color:#cfcdc5}
  .card__title{font-family:var(--font-display);font-weight:700;font-size:16.5px;line-height:1.36;letter-spacing:-.01em;margin:0;text-wrap:balance}
  .card__point{font-size:13px;line-height:1.6;color:var(--muted);margin:0;padding-top:11px;border-top:1px solid var(--line)}
  .card__point b{color:var(--signal);font-weight:600}
  .card__src{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted);margin-top:auto}

  /* monthly */
  .monthly{margin:clamp(36px,5vw,60px) 0 0;position:relative;display:block;text-decoration:none;color:inherit;
    border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper-2);
    padding:clamp(26px,4vw,40px);transition:box-shadow .3s ease,transform .3s ease}
  .monthly:hover{box-shadow:0 14px 40px -16px rgba(0,0,0,.2);transform:translateY(-2px)}
  .monthly__ghost{position:absolute;top:-30px;right:10px;font-family:var(--font-display);font-weight:800;font-size:180px;line-height:1;color:rgba(26,27,30,.05);letter-spacing:-.05em}
  .monthly__k{position:relative;font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--signal);margin-bottom:12px}
  .monthly__h{position:relative;font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3.6vw,32px);line-height:1.14;letter-spacing:-.02em;margin:0;text-wrap:balance}
  .monthly__sub{position:relative;color:var(--muted);margin-top:12px;font-size:14px}
  .monthly__arrow{position:relative;display:inline-block;margin-top:18px;font-family:var(--font-mono);font-size:12.5px}
  .monthly__arrow .sig{color:var(--signal)}

  /* footer */
  .foot{border-top:1px solid var(--line);margin-top:clamp(34px,5vw,56px);padding:24px 0 46px;
    display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
  .foot .sig{color:var(--signal)}

  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  @media (max-width:760px){
    .hero{grid-template-columns:1fr}
    .lead{border-right:0;border-bottom:1px solid var(--hero-line)}
    /* 마스트헤드: 브랜드/메타 세로 스택(긴 메타 줄바꿈 방지) */
    .mast{flex-direction:column;align-items:flex-start;gap:6px}
    .mast__meta{text-align:left}
    /* 섹션 헤더: eyebrow·제목·우측메타 세로 스택 */
    .sec__head{flex-direction:column;align-items:flex-start;gap:5px}
    .sec__head .more{margin-left:0}
  }
  @media (max-width:520px){
    .lead__fact{flex-direction:column;gap:4px}
    .grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){.wake *{animation:none !important}}
  .lead__tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
  .lead__tags .tag{border-color:var(--hero-line);color:var(--hero-muted)}
  /* 원문 링크: 제목은 색 상속·밑줄 없음, 호버 시 밑줄 */
  .live__t a, .card__title a{color:inherit;text-decoration:none}
  .live__t a:hover, .card__title a:hover{text-decoration:underline;text-underline-offset:2px}
  .lead__src{display:inline-block;margin-top:18px;font-family:var(--font-mono);font-size:11.5px;
    letter-spacing:.06em;color:var(--signal);text-decoration:none}
  .lead__src:hover{text-decoration:underline;text-underline-offset:2px}


.awrap{max-width:1080px;margin:0 auto;padding:0 clamp(18px,5vw,52px)}
.asearch{position:sticky;top:0;background:var(--paper);padding:18px 0;border-bottom:1px solid var(--line);z-index:5}
.asearch input{width:100%;box-sizing:border-box;font-family:var(--font-body);font-size:16px;color:var(--ink);
  background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;outline:none}
.asearch input:focus{border-color:var(--signal)}
.acount{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin:14px 0 6px;font-variant-numeric:tabular-nums}
.arow{display:grid;grid-template-columns:88px 44px 1fr auto;gap:14px;align-items:baseline;
  padding:13px 6px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.arow:hover{background:var(--paper-2)}
.ad{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ac{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:2px 6px;text-align:center;height:fit-content}
.ac.ai{color:var(--ink);border-color:#cfcdc5}
.at{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.4;letter-spacing:-.01em}
.arow:hover .at{color:var(--signal)}
.as{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.amore{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-align:center;padding:26px 0}
@media(max-width:640px){.arow{grid-template-columns:1fr auto;gap:4px 10px}.ad{grid-row:2}.ac{grid-row:2;justify-self:start}.as{display:none}.at{grid-column:1/3}}

</style></head><body>
<div class="wake"><div class="wrap awrap">
  <header class="mast">
    <div class="mast__brand"><a href="beacon.html" style="color:inherit;text-decoration:none">오늘, 세상이</a><span class="sub">VAAX · 아카이브</span></div>
    <div class="mast__meta"><a href="beacon.html" style="color:var(--signal);text-decoration:none">← 오늘의 경종</a></div>
  </header>
  <section class="sec" style="padding-top:24px">
    <div class="sec__head"><span class="sec__eyebrow">Archive · Search</span><h2>수집 기사 전체</h2></div>
    <p style="color:var(--muted);font-size:14px;margin:-8px 0 4px">경종에 노출된 기사와 노출되지 않은 기사까지, 수집된 AI·XR 뉴스 전체 누적본입니다.</p>
    <div class="asearch"><input id="q" type="search" placeholder="제목·출처로 검색 (예: 오픈AI, 영상생성, 삼성)" autocomplete="off"></div>
    <div class="acount" id="count">불러오는 중…</div>
    <div id="results"></div>
  </section>
  <footer class="foot"><span>VAAX · 오늘, 세상이 · 아카이브</span><span class="sig">누적 9,904건</span></footer>
</div></div>
<script>
const R=document.getElementById('results'),Q=document.getElementById('q'),C=document.getElementById('count');
let DATA=[];
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(q){
  q=(q||'').trim().toLowerCase();
  const f=q?DATA.filter(x=>(x.t+' '+x.s).toLowerCase().includes(q)):DATA;
  C.textContent=f.length.toLocaleString()+'건'+(q?' · 검색 결과':' · 전체');
  R.innerHTML=f.slice(0,300).map(x=>`<a class="arow" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer"><span class="ad">${x.d}</span><span class="ac ${x.c}">${x.c.toUpperCase()}</span><span class="at">${esc(x.t)}</span><span class="as">${esc(x.s)}</span></a>`).join('')
    +(f.length>300?'<div class="amore">상위 300건만 표시 — 검색으로 좁혀 보세요</div>':'');
}
fetch('archive.json').then(r=>r.json()).then(d=>{DATA=d;render('');});
Q.addEventListener('input',e=>render(e.target.value));
</script>
