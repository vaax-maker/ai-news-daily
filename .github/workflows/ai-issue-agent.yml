name: AI 이슈 모니터링 에이전트

on:
  schedule:
    # 매일 07:30 KST = 22:30 UTC (전날)
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      hours_back:
        description: '수집 시간 범위 (기본: 48시간)'
        required: false
        default: '48'
      dry_run:
        description: 'Dry run 모드 (테스트)'
        required: false
        type: boolean
        default: false

jobs:
  ai-issue-monitor:
    name: AI 이슈 수집 및 인포그래픽 생성
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. 저장소 체크아웃 ──────────────────────────
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # ── 2. Python 설정 ──────────────────────────────
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-issue-agent/requirements.txt

      # ── 3. 의존성 설치 ──────────────────────────────
      - name: 의존성 설치
        run: |
          cd ai-issue-agent
          pip install -r requirements.txt

      # ── 4. Playwright 브라우저 설치 (인포그래픽용) ──
      - name: Playwright Chromium 설치
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      # ── 5. 한국어 폰트 설치 ─────────────────────────
      - name: 한국어 폰트 설치 (Noto Sans KR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      # ── 6. NotebookLM 스킬 설정 ─────────────────────
      - name: NotebookLM 스킬 설정
        env:
          NOTEBOOKLM_COOKIES: ${{ secrets.NOTEBOOKLM_COOKIES }}
        run: |
          SKILL_DIR="$HOME/.agents/skills/notebooklm"
          mkdir -p "$SKILL_DIR/data/browser_state"
          # 쿠키 파일 복원
          if [ -n "$NOTEBOOKLM_COOKIES" ]; then
            echo "$NOTEBOOKLM_COOKIES" | base64 -d > "$SKILL_DIR/data/browser_state/state.json"
            echo "✅ NotebookLM 인증 상태 복원 완료 (state.json)"
          else
            echo "⚠️ NOTEBOOKLM_COOKIES 미설정 - 로컬 분석 모드 사용"
          fi
          # notebooklm 스킬 심볼릭 링크 (저장소에 포함된 경우)
          if [ -d "antigravity-awesome-skills/skills/notebooklm" ]; then
            cp -r antigravity-awesome-skills/skills/notebooklm "$SKILL_DIR"
          fi

      # ── 7. output 폴더 생성 ─────────────────────────
      - name: 출력 폴더 생성
        run: mkdir -p ai-issue-agent/output

      # ── 8. 에이전트 실행 ────────────────────────────
      - name: AI 이슈 모니터링 에이전트 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTEBOOKLM_COOKIES: ${{ secrets.NOTEBOOKLM_COOKIES }}
        run: |
          cd ai-issue-agent
          HOURS="${{ github.event.inputs.hours_back || '48' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          
          ARGS="--hours $HOURS"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run --no-telegram"
          fi
          
          echo "🚀 에이전트 실행: python scripts/run_agent.py $ARGS"
          python scripts/run_agent.py $ARGS

      # ── 9. 생성 결과물 아티팩트 저장 ────────────────
      - name: 결과물 아티팩트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-issue-report-${{ github.run_id }}
          path: |
            ai-issue-agent/output/
          retention-days: 7

      # ── 10. 실패 시 Telegram 알림 ───────────────────
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF'
          import os, asyncio, telegram
          async def notify():
              bot = telegram.Bot(os.environ["TELEGRAM_BOT_TOKEN"])
              await bot.send_message(
                  os.environ["TELEGRAM_CHAT_ID"],
                  f"❌ *AI 이슈 에이전트 실패*\nRun ID: ${{ github.run_id }}\n[로그 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  parse_mode="Markdown"
              )
          asyncio.run(notify())
          EOF
