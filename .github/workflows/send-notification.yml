name: Send Telegram Notification

on:
  repository_dispatch:
    types: [send-notification]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"  # 매 30분마다 실행 (Fail-safe)

jobs:
  send-notification:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Process Notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_NOTIFICATION: "true"
        run: |
          python scripts/process_scheduled.py

      - name: Update Quickview & Dashboard
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # Needed for dashboard generation context if used
        run: |
          python scripts/update_quickview.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git pull --rebase --autostash origin main
          git add docs/quickview docs/index.html
          git commit -m "Update Quickview & Dashboard [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
