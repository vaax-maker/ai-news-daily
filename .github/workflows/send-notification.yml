name: Send Telegram Notification

on:
  repository_dispatch:
    types: [send-notification]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"  # 매 30분마다 실행 (Fail-safe)

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Process Notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_NOTIFICATION: "true"
        run: |
          python scripts/process_scheduled.py

      # (은퇴) 옛 vaax 홈 폐기 — quickview/대시보드 재생성·커밋 스텝 제거(2026-08).
      #   대문 index.html은 v2 beacon 리다이렉트(정적)로 고정되며, 매 30분 재생성이
      #   그것을 옛 대시보드로 덮던 문제를 원천 제거. 이 워크플로는 이제 텔레그램 알림
      #   (process_scheduled)만 수행하고 git 커밋을 하지 않는다.
