name: Daily AI News

on:
  workflow_dispatch:
    inputs:
      run_ai:
        description: "🔵 AI 읽을거리"
        required: false
        default: "실행"
        type: choice
        options:
          - "실행"
          - "건너뛰기"
      run_xr:
        description: "🟢 XR 읽을거리"
        required: false
        default: "실행"
        type: choice
        options:
          - "실행"
          - "건너뛰기"
      run_gov:
        description: "🟣 정부과제"
        required: false
        default: "실행"
        type: choice
        options:
          - "실행"
          - "건너뛰기"
      run_members:
        description: "🟠 회원사소식"
        required: false
        default: "건너뛰기"
        type: choice
        options:
          - "실행"
          - "건너뛰기"
      max_articles:
        description: "📰 카테고리별 기사 수"
        required: false
        default: "10"
      ranking_strategy:
        description: "🎯 기사 선정 로직"
        required: false
        default: "heuristic"
        type: choice
        options:
          - "heuristic"
          - "llm"
          - "hybrid"
  schedule:
    - cron: "20 22 * * *"  # 매일 22:20 UTC (한국시간 오전 7시 20분)
    - cron: "20 8 * * *"   # 매일 08:20 UTC (한국시간 오후 5시 20분)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 실행 여부
      RUN_AI: ${{ github.event.inputs.run_ai == '건너뛰기' && 'false' || 'true' }}
      RUN_XR: ${{ github.event.inputs.run_xr == '건너뛰기' && 'false' || 'true' }}
      RUN_GOV: ${{ github.event.inputs.run_gov == '건너뛰기' && 'false' || 'true' }}
      RUN_MEMBERS: 'false'  # 회원사소식 기능 비활성화
      
      # 기사 수 설정
      MAX_ARTICLES: ${{ github.event.inputs.max_articles || '10' }}
      
      # 기사 선정 전략 (heuristic, llm, hybrid)
      AI_RANKING_STRATEGY: ${{ github.event.inputs.ranking_strategy || 'heuristic' }}

      # Firestore 백엔드 활성화 (data/ 지속성)
      FIRESTORE_ENABLED: "true"

    steps:
      - name: Checkout repo
        # v4 - pinned to full SHA for security compliance
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        # v5 - pinned to full SHA for security compliance
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate AI News HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GOV_API_KEY: ${{ secrets.GOV_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENABLE_NOTIFICATION: "true"
        run: |
          echo "📰 뉴스 생성 시작"
          echo "  - AI: $RUN_AI"
          echo "  - XR: $RUN_XR"
          echo "  - 정부과제: $RUN_GOV"
          echo "  - 회원사: $RUN_MEMBERS"
          echo "  - 기사 수: $MAX_ARTICLES개"

          # main.py가 정부과제 수집+저장+렌더링을 통합 처리
          # (collect_gov_data.py 이중 수집 제거 - 2026-03-17)
          python main.py

          # 3. Validate generated output
          test -f docs/index.html || (echo "❌ index.html 생성 실패" && exit 1)
          [ $(wc -c < docs/index.html) -gt 1024 ] || (echo "❌ index.html 비정상 (너무 작음)" && exit 1)
          grep -q "</html>" docs/index.html || (echo "❌ index.html HTML 구조 불완전" && exit 1)

          # gov/index.html 유실 방지: 10KB 미만이면 데이터 유실로 판단하고 원복
          if [ -f docs/gov/index.html ]; then
            GOV_SIZE=$(wc -c < docs/gov/index.html)
            if [ "$GOV_SIZE" -lt 10240 ]; then
              echo "⚠️ gov/index.html 비정상 (${GOV_SIZE}B < 10KB) — 이전 버전 복원"
              git checkout HEAD -- docs/gov/index.html 2>/dev/null || true
            fi
          fi
          echo "✅ 출력 검증 통과"

          # 4. 대문 전환: 루트 index.html → v2 beacon 리다이렉트 (레거시 홈 은퇴).
          #    index.html>1KB 검증을 통과한 뒤 덮어쓰므로 검증 함정 없음. 수집·하위페이지는 유지.
          python3 -c "open('docs/index.html','w',encoding='utf-8').write('<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><meta http-equiv=\"refresh\" content=\"0; url=v2/beacon.html\"><link rel=\"canonical\" href=\"https://vaax-maker.github.io/ai-news-daily/v2/beacon.html\"><title>오늘, 세상이 · VAAX</title></head><body style=\"margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#121417;color:#F1EFEA;font-family:sans-serif\"><a href=\"v2/beacon.html\" style=\"color:#D8452F;font-size:18px;text-decoration:none\">오늘, 세상이 — 페이지 이동 →</a></body></html>')"
          echo "✅ 대문을 v2 beacon으로 전환"

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      
          git pull --rebase --autostash origin main
          git add docs data
          git commit -m "Update Daily News & Member Data" || echo "No changes to commit"
          git push origin HEAD:main
