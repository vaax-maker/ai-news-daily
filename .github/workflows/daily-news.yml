name: Daily AI News

on:
  workflow_dispatch:
    inputs:
      run_ai:
        description: "🔵 AI 읽을거리"
        required: false
        default: "실행"
        type: choice
        options:
          - "실행"
          - "건너뛰기"
      run_xr:
        description: "🟢 XR 읽을거리"
        required: false
        default: "실행"
        type: choice
        options:
          - "실행"
          - "건너뛰기"
      run_gov:
        description: "🟣 정부과제"
        required: false
        default: "실행"
        type: choice
        options:
          - "실행"
          - "건너뛰기"
      run_members:
        description: "🟠 회원사소식"
        required: false
        default: "실행"
        type: choice
        options:
          - "실행"
          - "건너뛰기"
      max_articles:
        description: "📰 카테고리별 기사 수"
        required: false
        default: "10"
      use_llm_ranking:
        description: "🤖 LLM 랭킹 사용 (비용 발생)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 23 * * *"   # 매일 23:00 UTC (한국시간 오전 8시)
    - cron: "0 7 * * *"    # 매일 07:00 UTC (한국시간 오후 4시)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 실행 여부
      RUN_AI: ${{ github.event.inputs.run_ai == '건너뛰기' && 'false' || 'true' }}
      RUN_XR: ${{ github.event.inputs.run_xr == '건너뛰기' && 'false' || 'true' }}
      RUN_GOV: ${{ github.event.inputs.run_gov == '건너뛰기' && 'false' || 'true' }}
      RUN_MEMBERS: ${{ github.event.inputs.run_members == '건너뛰기' && 'false' || 'true' }}
      
      # 기사 수 및 랭킹 설정
      MAX_ARTICLES: ${{ github.event.inputs.max_articles || '10' }}
      USE_LLM_RANKING: ${{ github.event.inputs.use_llm_ranking || 'false' }}
      
      # 필터링 파이프라인 (하드코딩, 보통 변경 불필요)
      FILTER_MAX_FIRST_STAGE: "30"
      AI_RANKING_STRATEGY: "heuristic"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate AI News HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GOV_API_KEY: ${{ secrets.GOV_API_KEY }}
        run: |
          echo "📰 뉴스 생성 시작"
          echo "  - AI: $RUN_AI"
          echo "  - XR: $RUN_XR"
          echo "  - 정부과제: $RUN_GOV"
          echo "  - 회원사: $RUN_MEMBERS"
          echo "  - 기사 수: $MAX_ARTICLES개"
          echo "  - LLM 랭킹: $USE_LLM_RANKING"
          python main.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      
          git pull --rebase --autostash origin main
          git add docs data
          git commit -m "Update Daily News & Member Data" || echo "No changes to commit"
          git push origin HEAD:main
