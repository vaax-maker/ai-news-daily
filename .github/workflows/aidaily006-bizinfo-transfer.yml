name: AIDAILY006 encrypted credential handoff to mini1
on:
  push:
    branches: [aidaily006-api-probe-20261104]
    paths: [.github/workflows/aidaily006-bizinfo-transfer.yml]
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Encrypt to the owner mini1 public key
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: python3 .github/scripts/aidaily006-bizinfo-transfer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aidaily006-mini1-encrypted
          path: |
            credential.enc
            transfer.json
          retention-days: 1
