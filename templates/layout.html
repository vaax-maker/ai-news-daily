<!DOCTYPE html>
<html lang='ko'>

<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <title>{% block title %}AI & XR News{% endblock %}</title>
    {% if ga_id %}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', '{{ ga_id }}');
    </script>
    {% endif %}
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Pretendard:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ root_path | default('.') }}/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <header>
        <div class="gnb">
            <a href="{{ root_path | default('.') }}/index.html" class="logo-link">
                <img src="{{ root_path | default('.') }}/static/images/logo_new.png"
                    alt="VAAX - VR-AR-AI-XR기술과 Biz.를 연결하는 성장나눔 커뮤니티 since 2016" class="header-logo">
            </a>
            <nav class="nav-links">
                <a href="{{ root_path | default('.') }}/index.html"
                    class="{% if active_tab == 'home' %}active{% endif %}">Home</a>
                <a href="{{ root_path | default('.') }}/ai/index.html"
                    class="{% if active_tab == 'ai' %}active{% endif %}">AI뉴스</a>
                <a href="{{ root_path | default('.') }}/xr/index.html"
                    class="{% if active_tab == 'xr' %}active{% endif %}">XR뉴스</a>
                <a href="{{ root_path | default('.') }}/gov/index.html"
                    class="{% if active_tab == 'gov' %}active{% endif %}">정부과제</a>
                <a href="{{ root_path | default('.') }}/members/index.html"
                    class="{% if active_tab == 'members' %}active{% endif %}">회원사소식</a>
                <a href="{{ root_path | default('.') }}/board/index.html"
                    class="{% if active_tab == 'board' %}active{% endif %}">게시판</a>
            </nav>
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; {{ now_year }} AI News Daily Project. All rights reserved.</p>
    </footer>
</body>

</html>
