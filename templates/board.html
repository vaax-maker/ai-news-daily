{% extends "layout.html" %}

{% block title %}자유 게시판{% endblock %}

{% block extra_css %}
<style>
    .board-card {
        max-width: 900px;
        margin: 0 auto;
    }

    .board-intro {
        margin-bottom: 2rem;
    }

    .board-intro-text {
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--text-muted);
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-titles">
        <p class="eyebrow">Community</p>
        <h1>자유 게시판</h1>
        <p class="subtitle">누구나 자유롭게 의견을 나누고 자료를 공유하는 공간입니다.</p>
    </div>
</div>

<section class="card board-card">
    <div class="board-intro">
        <p class="board-intro-text">
            💡 <strong>안내:</strong> 게시글/댓글 작성 및 파일 업로드를 위해서는 <strong>GitHub 계정 로그인</strong>이 필요합니다.<br>
            📱 <strong>모바일 이미지 업로드:</strong> 갤러리에서 사진을 <strong>'복사'</strong>한 후 입력창에 <strong>'붙여넣기'</strong> 해주세요.
        </p>
    </div>

    <!-- Giscus Comments System -->
    <div class="giscus"></div>
    <script src="https://giscus.app/client.js" data-repo="vaax-maker/ai-news-daily" data-repo-id="R_kgDOQgKDLA"
        data-category="General" data-category-id="DIC_kwDOQgKDLM4Cz8nE" data-mapping="pathname" data-strict="0"
        data-reactions-enabled="1" data-emit-metadata="0" data-input-position="bottom"
        data-theme="preferred_color_scheme" data-lang="ko" crossorigin="anonymous" async>
        </script>
</section>
{% endblock %}
