{% extends "layout.html" %}

{% block title %}자유 게시판{% endblock %}

{% block extra_css %}
<style>
    .board-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem 0;
    }

    .board-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .board-intro {
        color: var(--text-muted);
        margin-bottom: 2rem;
        background: #f8fafc;
        padding: 1rem;
        border-radius: 8px;
        font-size: 0.95rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="board-container">
    <div class="board-header">
        <h1>자유 게시판</h1>
        <p class="subtitle">누구나 자유롭게 의견을 나누고 자료를 공유하는 공간입니다.</p>
        <p class="small text-muted" style="font-size: 0.85rem; margin-top: -1.5rem;">
            * 게시글/댓글 작성 및 파일 업로드를 위해서는 <strong>GitHub 계정 로그인</strong>이 필요합니다. (조회는 로그인 없이 가능)
        </p>
    </div>

    <!-- Giscus Comments System -->
    <div class="giscus"></div>
    <script src="https://giscus.app/client.js" data-repo="vaax-maker/ai-news-daily" data-repo-id="R_kgDOQgKDLA"
        data-category="General" data-category-id="DIC_kwDOQgKDLM4Cz8nE" data-mapping="pathname" data-strict="0"
        data-reactions-enabled="1" data-emit-metadata="0" data-input-position="bottom"
        data-theme="preferred_color_scheme" data-lang="ko" crossorigin="anonymous" async>
        </script>
</div>
{% endblock %}
